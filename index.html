<html lang="fr">
<head>

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }

<body>
<title>Maths ECG 2 Hoche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with animated dropdown menus (mobile: sliding sheet with accordions),
   one centred reading column. Identity: a quiet academic journal — serif display, neutral greys
   with a cool bias, a single cobalt accent; colour is reserved for the meaning of colle tags. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --raised: #fbfbfc;
  --ink: #0e1117;
  --ink-2: #353b47;
  --muted: #697080;
  --line: #e3e6eb;
  --line-2: #eef0f3;
  --accent: #3145d1;
  --accent-ink: #ffffff;
  --accent-soft: #eef0fc;
  --t-a: #3145d1;  --t-a-bg: #eef0fc;
  --t-c: #0d7451;  --t-c-bg: #e7f4ee;
  --t-ac: #94600a; --t-ac-bg: #fbf2e1;
  --t-td: #6a3fc4; --t-td-bg: #f2edfb;
  --hp: #8c4a5a;   --hp-bg: #f8edf0;
  --ok: #0d7451; --bad: #c2373a; --bad-bg: #fbeaea; --ok-bg: #e7f4ee;
  --glass: rgba(255, 255, 255, .78);
  --shadow-sm: 0 1px 2px rgba(14, 17, 23, .05);
  --shadow: 0 1px 2px rgba(14, 17, 23, .04), 0 8px 24px -8px rgba(14, 17, 23, .10);
  --shadow-lg: 0 2px 6px rgba(14, 17, 23, .05), 0 24px 60px -12px rgba(14, 17, 23, .22);
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "Geist", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0c10; --surface: #11141a; --raised: #151922; --ink: #eceef2; --ink-2: #c3c8d2; --muted: #8b93a3;
  --line: #222733; --line-2: #1a1e27; --accent: #8e9cff; --accent-ink: #0a0c10; --accent-soft: #1b2040;
  --t-a: #a3afff; --t-a-bg: #1b2040; --t-c: #6fd3a6; --t-c-bg: #10291f; --t-ac: #f0c46c; --t-ac-bg: #2d2311;
  --t-td: #c7a7ff; --t-td-bg: #241b38; --hp: #eea7b8; --hp-bg: #2f1b22;
  --ok: #6fd3a6; --bad: #ff8f8f; --bad-bg: #351b1d; --ok-bg: #10291f; --glass: rgba(17, 20, 26, .72);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 30px 70px -10px rgba(0,0,0,.75); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0c10; --surface: #11141a; --raised: #151922; --ink: #eceef2; --ink-2: #c3c8d2; --muted: #8b93a3;
  --line: #222733; --line-2: #1a1e27; --accent: #8e9cff; --accent-ink: #0a0c10; --accent-soft: #1b2040;
  --t-a: #a3afff; --t-a-bg: #1b2040; --t-c: #6fd3a6; --t-c-bg: #10291f; --t-ac: #f0c46c; --t-ac-bg: #2d2311;
  --t-td: #c7a7ff; --t-td-bg: #241b38; --hp: #eea7b8; --hp-bg: #2f1b22;
  --ok: #6fd3a6; --bad: #ff8f8f; --bad-bg: #351b1d; --ok-bg: #10291f; --glass: rgba(17, 20, 26, .72);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.6);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 30px 70px -10px rgba(0,0,0,.75); color-scheme: dark }

* { box-sizing: border-box }
html { scroll-behavior: smooth }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg) }
a { color: var(--accent); text-underline-offset: 3px }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; letter-spacing: -.015em; text-wrap: balance; margin: 0 }
.wrap { max-width: 1120px; margin: 0 auto }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px));
  background: var(--glass); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; align-items: center; gap: 18px; height: 60px }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none }
.brand .mono { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: italic 500 19px/1 var(--f-display) }
.brand b { font: 500 18px/1 var(--f-display); letter-spacing: -.01em }
.brand small { display: block; font: 400 11.5px/1.2 var(--f-mono); color: var(--muted); margin-top: 3px; letter-spacing: .02em }
.topnav { position: relative; display: flex; align-items: center; gap: 2px; margin: 0 auto 0 12px; list-style: none; padding: 0 }
.topnav > li { position: relative }
.nav-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 9px; color: var(--ink-2); font-weight: 500; font-size: 14.5px; text-decoration: none; transition: color .15s, background .15s }
.nav-btn:hover, .open > .nav-btn { color: var(--ink); background: var(--line-2) }
.nav-btn[aria-current="page"] { color: var(--ink) }
.nav-btn .caret { width: 12px; height: 12px; transition: transform .25s var(--ease) }
.open > .nav-btn .caret { transform: rotate(180deg) }
.indicator { position: absolute; bottom: -12px; height: 2px; border-radius: 2px; background: var(--ink); left: 0; width: 0; transition: left .35s var(--ease), width .35s var(--ease), opacity .2s; pointer-events: none }
.panel { position: absolute; top: calc(100% + 12px); left: -8px; min-width: 300px; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg);
  opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.98); transform-origin: 24px 0;
  transition: opacity .16s ease, transform .24s var(--ease), visibility 0s linear .24s }
.open > .panel { opacity: 1; visibility: visible; transform: none; transition: opacity .18s ease, transform .3s var(--ease), visibility 0s }
.panel::before { content: ""; position: absolute; inset: -14px 0 auto; height: 14px }
.topnav > li:nth-last-of-type(-n+2) .panel { left: auto; right: -8px; transform-origin: calc(100% - 24px) 0 }
.panel.wide { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: min(760px, calc(100vw - 48px)) }
.panel .col { display: grid; gap: 2px; align-content: start }
.panel .col + .col { border-left: 1px solid var(--line-2); padding-left: 8px }
.panel h4 { margin: 4px 10px 6px; font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.mi { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); transition: background .15s }
.mi:hover, .mi:focus-visible { background: var(--line-2) }
.mi .n { font: italic 500 17px/1 var(--f-display); color: var(--muted); min-width: 20px; text-align: right; font-variant-numeric: tabular-nums }
.mi .t { font-weight: 500; font-size: 14px; line-height: 1.3 }
.mi .s { grid-column: 2; font-size: 12.5px; color: var(--muted); line-height: 1.3 }
.mi .r { font: 400 11px var(--f-mono); color: var(--muted) }
.mi .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--line-2); color: var(--ink-2) }
.mi.off { opacity: .45 }
.mi .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok) }
.open > .panel .mi { animation: mi-in .32s var(--ease) both; animation-delay: calc(var(--i, 0) * 16ms) }
@keyframes mi-in { from { opacity: .2; transform: translateY(-4px) } }
.tools { display: flex; align-items: center; gap: 6px; flex: none }
.kbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; transition: border-color .15s, color .15s }
.kbtn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)) }
.kbtn kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--muted) }
.ibtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); transition: background .15s }
.ibtn:hover { background: var(--line-2) }
.burger { display: none }
/* rolling digital clock: each digit is a reel of 0…max (plus a trailing 0 so 9 → 0 keeps rolling forward) */
.clock { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font: 500 14.5px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); --h: 1.15em }
.clock .dg { display: inline-block; height: var(--h); overflow: hidden; width: 1ch; mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent) }
.clock .rl { display: grid; transform: translateY(calc(var(--k, 0) * -1 * var(--h))); transition: transform .55s var(--ease) }
.clock .rl span { height: var(--h); line-height: var(--h); text-align: center }
.clock .rl.snap { transition: none }
.clock .co { width: .7ch; text-align: center; color: var(--muted); transition: opacity .3s }
.clock .s { color: var(--muted) }
.clock.blink .co { opacity: .35 }

/* ---------- mobile sheet ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 14, .38); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s }
.sheet-bg.on { opacity: 1; visibility: visible; transition: opacity .25s }
.msheet { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(380px, 88vw); background: var(--surface); box-shadow: var(--shadow-lg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-right, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 24px) 18px;
  transform: translateX(104%); transition: transform .38s var(--ease); display: grid; align-content: start; gap: 4px }
.msheet.on { transform: none }
.msheet .top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px }
.acc > button, .msheet > a.lnk { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 6px; font: 500 21px var(--f-display); text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line-2) }
.acc > button .caret { width: 14px; height: 14px; transition: transform .3s var(--ease) }
.acc.open > button .caret { transform: rotate(180deg) }
.acc .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease) }
.acc.open .body { grid-template-rows: 1fr }
.acc .body > div { overflow: hidden; display: grid; gap: 1px }
.acc .body a { padding: 9px 8px; text-decoration: none; color: var(--ink-2); font-size: 15px; border-radius: 8px }
.acc .body a:first-child { margin-top: 6px }
.acc .body a:last-child { margin-bottom: 8px }

/* ---------- page ---------- */
main { padding-block: 34px 80px }
#view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px }
.rv { animation: rv .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms) }
@keyframes rv { from { transform: translateY(14px) } }
.head { display: grid; gap: 10px; max-width: 760px }
.eyebrow { font: 500 11.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center }
.eyebrow::before { content: ""; width: 18px; height: 1px; background: currentColor }
.head h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.02 }
.head h1 em { font-style: italic; color: var(--muted) }
.head p { margin: 0; color: var(--muted); font-size: 16.5px; max-width: 62ch }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); min-width: 0 }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px }
.sec-title h2 { font-size: 24px }
.sec-title .n { font: 400 12px var(--f-mono); color: var(--muted) }
.sec-title.sub h2 { font-size: 19px; font-style: italic; color: var(--ink-2) }
.group { display: grid; gap: 14px }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px; border-radius: 9px; font-weight: 500; font-size: 13.5px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; transition: border-color .15s, background .15s, transform .15s }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)) }
.btn:active { transform: translateY(1px) }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--accent)) }
.btn .dt { width: 6px; height: 6px; border-radius: 50%; background: var(--muted) }
.btn.k-A .dt { background: var(--t-a) } .btn.k-Ac .dt { background: var(--t-ac) } .btn.k-TD .dt { background: var(--t-td) }
.badge { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em }
.badge.soon { color: var(--muted); border: 1px dashed var(--line) }
.badge.new { color: var(--accent-ink); background: var(--accent) }
.empty { color: var(--muted); margin: 0 }

/* doc rows */
.rows { list-style: none; margin: 0; padding: 0 }
.rows > li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 15px 18px; border-bottom: 1px solid var(--line-2); transition: background .15s }
.rows > li:hover { background: var(--raised) }
.rows > li:last-child { border-bottom: 0 }
.rows .what { flex: 1 1 300px; min-width: 0; display: grid; gap: 2px }
.rows .what b { font-weight: 500 }
.rows .what small { color: var(--muted); font-size: 13px }
.rows .what ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); font-size: 13.5px; display: grid; gap: 2px }
.rows .acts { display: flex; flex-wrap: wrap; gap: 6px }
.rows li.soon .what b { color: var(--muted); font-weight: 400 }

/* ---------- home ---------- */
.cal { padding: clamp(20px, 3.5vw, 32px); display: grid; gap: 22px }
.cal-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px 32px }
.cal-h .big { font: 400 clamp(56px, 9vw, 96px)/.9 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums }
.cal-h .big span { color: var(--muted); font-size: .42em; letter-spacing: 0; margin-left: 10px; font-style: italic }
.cal-h .sub { color: var(--muted); margin-top: 10px }
.cal-h .sub b { color: var(--ink); font-weight: 500 }
.cal-h .pct { text-align: right; display: grid; gap: 4px }
.cal-h .pct b { font: 400 40px/1 var(--f-display); font-variant-numeric: tabular-nums }
.cal-h .pct span { font: 400 12px var(--f-mono); color: var(--muted) }
.cal-g { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 8px; overflow-x: auto; padding-bottom: 2px }
.cal-g .months, .cal-g .days { display: grid; grid-template-columns: repeat(var(--w), minmax(0, 1fr)); column-gap: var(--gap) }
.cal-g .months { font: 400 11px/1 var(--f-mono); color: var(--muted); text-transform: lowercase; height: 12px }
.cal-g .months span { white-space: nowrap }
.cal-g .wd { display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); row-gap: var(--gap); font: 400 10px/1 var(--f-mono); color: var(--muted); align-items: center }
.cal-g .days { grid-template-rows: repeat(7, auto); grid-auto-flow: column; row-gap: var(--gap) }
.cal { --gap: clamp(2px, .4vw, 5px) }
.sq { aspect-ratio: 1; border-radius: 3px; background: var(--line-2); box-shadow: inset 0 0 0 1px var(--line) }
.sq.pad { visibility: hidden }
.sq.past { background: var(--accent); box-shadow: none }
.sq.today { background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent) }
.sq.goal { background: var(--ink); box-shadow: none; border-radius: 50% }
@media (prefers-reduced-motion: no-preference) {
  .anim .sq.past { animation: sq-in .45s var(--ease) both; animation-delay: calc(var(--k) * 3ms + 150ms) }
  .anim .sq.today { animation: sq-today 2.4s ease-in-out infinite }
  @keyframes sq-in { from { transform: scale(.35) } }
  @keyframes sq-today { 50% { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px color-mix(in srgb, var(--accent) 40%, transparent) } }
}
.cal-f { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; font-size: 13px; color: var(--muted) }
.cal-f .lg { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center }
.cal-f .lg span { display: inline-flex; gap: 7px; align-items: center }
.cal-f .lg .sq { width: 11px; display: inline-block }
@media (max-width: 640px) {
  .cal-g { display: block; overflow: visible }
  .cal-g > span, .cal-g .months, .cal-g .wd { display: none }
  .cal-g .days { grid-template-columns: repeat(auto-fill, minmax(11px, 1fr)); grid-template-rows: none; grid-auto-flow: row; gap: 3px }
  .sq.pad { display: none }
  .cal-h .big span { display: block; margin: 10px 0 0; font-size: .34em }
  .cal-h .pct { text-align: left }
}
.week { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 28px; align-items: center; padding: 26px 28px; position: relative; overflow: hidden }
.week .k { font: 500 11.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: flex; gap: 8px; align-items: center }
.week .k .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); animation: pulse 2s infinite }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
.week h2 { font-size: clamp(24px, 3vw, 32px); margin-top: 8px }
.week .m { color: var(--muted); margin-top: 6px }
.ring { width: 92px; height: 92px; position: relative; flex: none }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring circle { fill: none; stroke-width: 6 }
.ring .bg { stroke: var(--line-2) }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease) }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 500 20px/1 var(--f-display) }
.ring span small { display: block; font: 400 10.5px var(--f-mono); color: var(--muted); margin-top: 3px }
.week .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px }
.pane { padding: 22px 24px; display: grid; gap: 14px; align-content: start }
.pane h3 { font-size: 21px }
.tl { list-style: none; margin: 0; padding: 0; display: grid }
.tl li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 11px 0; border-top: 1px solid var(--line-2); align-items: baseline }
.tl li:first-child { border-top: 0 }
.tl .d { font: 400 26px/1 var(--f-display); font-variant-numeric: tabular-nums }
.tl .d small { display: block; font: 400 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px }
.tl .d.fz { font-size: 17px; font-style: italic }
.tl a { text-decoration: none; color: inherit; display: grid; gap: 1px }
.tl a b { font-weight: 500 }
.tl a span { color: var(--muted); font-size: 13.5px }
.tl a:hover b { color: var(--accent) }
.sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.sec { background: var(--surface); padding: 18px 20px; display: grid; gap: 6px; text-decoration: none; color: var(--ink); position: relative; transition: background .2s }
.sec:hover { background: var(--raised) }
.sec .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted) }
.sec .top .cnt { font: 400 12px var(--f-mono) }
.sec b { font: 500 20px var(--f-display) }
.sec span.d { color: var(--muted); font-size: 13.5px; line-height: 1.4 }
.sec .arrow { position: absolute; right: 18px; bottom: 18px; opacity: 0; transform: translateX(-6px); transition: opacity .2s, transform .3s var(--ease); color: var(--ink) }
.sec:hover .arrow { opacity: 1; transform: none }
.prof { padding: 22px 24px; display: grid; gap: 8px; color: var(--ink-2) }
.prof p { margin: 0 }
.prof b { font: 500 17px var(--f-display); color: var(--ink) }
.mail { font: 400 13.5px var(--f-mono); background: var(--line-2); padding: 2px 8px; border-radius: 6px; user-select: all }

/* ---------- cours ---------- */
.chaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px }
.chap { padding: 20px 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-content: start; transition: box-shadow .25s, transform .25s var(--ease), border-color .2s; scroll-margin-top: 90px }
.chap:hover { box-shadow: var(--shadow); transform: translateY(-2px) }
.chap.flash { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft) }
.chap .no { grid-row: span 3; font: italic 400 46px/0.9 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; min-width: 1.1em }
.chap.soon .no { color: var(--line) }
.chap h3 { font-size: 19.5px; line-height: 1.2 }
.chap .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px }
.chap .extra { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--muted) }
.chap .extra a { text-decoration: none; font-weight: 500 }
.chap .extra a:hover { text-decoration: underline }

/* ---------- colles ---------- */
.weeks { display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 12px; background: var(--line-2); scrollbar-width: none; position: relative }
.weeks::-webkit-scrollbar { display: none }
.weeks button { flex: none; min-width: 54px; height: 50px; border-radius: 9px; display: grid; place-items: center; align-content: center; gap: 1px; position: relative; z-index: 1; color: var(--ink-2); transition: color .2s }
.weeks button b { font: 500 16px/1 var(--f-display) }
.weeks button small { font: 400 9.5px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 3px }
.weeks button.off { opacity: .4 }
.weeks button.ann small { color: var(--ok) }
.weeks button.now b::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); vertical-align: super; margin-left: 2px }
.weeks .pill { position: absolute; top: 4px; height: 50px; border-radius: 9px; background: var(--surface); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); transition: left .38s var(--ease), width .38s var(--ease); z-index: 0 }
.sheet { padding: clamp(20px, 3.5vw, 34px); display: grid; gap: 22px }
.sheet-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 24px; align-items: end }
.sheet-h h2 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.08 }
.sheet-h .m { color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.stats div { padding: 14px 16px; border-left: 1px solid var(--line) }
.stats div:first-child { border-left: 0 }
.stats b { display: block; font: 400 30px/1 var(--f-display); font-variant-numeric: tabular-nums }
.stats span { font-size: 12.5px; color: var(--muted) }
.wdocs { display: grid; gap: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--raised) }
.wdocs > div { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; border-top: 1px solid var(--line-2) }
.wdocs > div:first-child { border-top: 0 }
.wdocs .c { display: flex; gap: 10px; align-items: baseline; min-width: 0; flex: 1 1 240px }
.wdocs .c i { font: italic 400 20px/1 var(--f-display); color: var(--muted) }
.wdocs .acts { display: flex; flex-wrap: wrap; gap: 6px }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--line-2) }
.seg button { padding: 6px 12px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); font-weight: 500; transition: background .2s, color .2s, box-shadow .2s }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line) }
/* each part (proofs, exercises) has a header that stays under the top bar while its questions scroll,
   with the number of the question in view; each question is its own block, sub-questions are lettered */
.sheet { --sp: clamp(20px, 3.5vw, 34px) }
.part { display: grid; gap: 10px }
.part[hidden], ol.items > li[hidden] { display: none }
.part-h { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 5; display: flex; align-items: baseline; gap: 12px;
  margin: 0 calc(-1 * var(--sp)); padding: 14px var(--sp) 12px; background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid transparent; transition: border-color .2s }
.part-h.stuck { border-bottom-color: var(--line) }
.part-h h3 { font-size: 23px }
.part-h .n { font: 400 12px var(--f-mono); color: var(--muted) }
.part-h .pos { margin-left: auto; white-space: nowrap; font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; opacity: 0; transform: translateY(3px); transition: opacity .25s, transform .3s var(--ease) }
.part-h.stuck .pos { opacity: 1; transform: none }
.part-h .pos b { color: var(--ink); font-weight: 500 }
.part-h .bar-p { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); transition: transform .35s var(--ease), opacity .2s; opacity: 0 }
.part-h.stuck .bar-p { opacity: 1 }
ol.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
ol.items > li { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px 14px; padding: 16px 18px 16px 16px; align-items: start;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 130px);
  transition: border-color .2s, box-shadow .25s, background .25s }
ol.items > li::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tc, var(--line)); transition: background .25s }
ol.items > li:hover { border-color: color-mix(in srgb, var(--ink) 16%, var(--line)); box-shadow: var(--shadow) }
ol.items > li.t-A { --tc: var(--t-a) } ol.items > li.t-C { --tc: var(--t-c) } ol.items > li.t-Ac { --tc: var(--t-ac) } ol.items > li.t-TD { --tc: var(--t-td) }
ol.items > li.done { background: var(--raised); --tc: var(--ok) }
ol.items > li.done .stmt { color: var(--muted) }
ol.items > li.flash { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft) }
.anim .sheet.swap { animation: sw .42s var(--ease) both }
@keyframes sw { from { transform: translateY(8px); opacity: .4 } }
.anim ol.items > li.in { animation: li-in .38s var(--ease) both; animation-delay: calc(var(--j, 0) * 22ms) }
@keyframes li-in { from { transform: translateY(8px); opacity: .35 } }
.num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--line-2); color: var(--ink-2); font: 500 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; transition: background .25s, color .25s }
ol.items > li.done .num { background: var(--ok-bg); color: var(--ok) }
.ib { min-width: 0; display: grid; gap: 10px; padding-top: 3px }
.stmt { overflow-x: auto; overflow-y: hidden; font-size: 15.5px; line-height: 1.65; color: var(--ink) }
.parts { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 0; counter-reset: q; border-top: 1px dashed var(--line) }
.parts > li { counter-increment: q; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px 10px; padding: 12px 0; border-bottom: 1px dashed var(--line) }
.parts > li:last-child { border-bottom: 0; padding-bottom: 0 }
.parts > li::before { content: counter(q, lower-alpha); grid-row: span 3; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; margin-top: 2px; border: 1px solid var(--line); font: italic 500 14px/1 var(--f-display); color: var(--ink-2) }
.parts > li > * { grid-column: 2 }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; letter-spacing: .02em; white-space: nowrap }
.tag.A { color: var(--t-a); background: var(--t-a-bg) } .tag.C { color: var(--t-c); background: var(--t-c-bg) }
.tag.Ac { color: var(--t-ac); background: var(--t-ac-bg) } .tag.TD { color: var(--t-td); background: var(--t-td-bg) }
.tag.HP { color: var(--hp); background: var(--hp-bg) }
.links { display: grid; gap: 6px }
a.ref { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 9px 12px 9px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); overflow: hidden; transition: border-color .2s, box-shadow .2s, transform .2s var(--ease) }
a.ref::before { content: ""; grid-row: span 2; align-self: stretch; margin: -9px 0; background: var(--kc, var(--muted)) }
a.ref:hover { border-color: color-mix(in srgb, var(--kc) 45%, var(--line)); box-shadow: var(--shadow); transform: translateY(-1px) }
a.ref .w { font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--kc) }
a.ref .t { font-size: 14px; font-weight: 500; line-height: 1.35; grid-column: 2 }
a.ref .p { grid-row: 1 / span 2; grid-column: 3; text-align: right; font: 400 20px/1 var(--f-display); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px }
a.ref .p small { display: block; font: 400 10.5px var(--f-mono); color: var(--muted); text-align: right }
a.ref.k-A { --kc: var(--t-a) } a.ref.k-Ac { --kc: var(--t-ac) } a.ref.k-TD { --kc: var(--t-td) } a.ref.k-C { --kc: var(--t-c) }
.chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; color: var(--muted); user-select: none; padding-top: 4px; white-space: nowrap }
.chk input { position: absolute; opacity: 0; pointer-events: none }
.chk .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s var(--ease) }
.chk .box svg { width: 12px; height: 12px; stroke: var(--surface); stroke-width: 3; fill: none; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .3s var(--ease) .05s }
.chk input:checked + .box { background: var(--ok); border-color: var(--ok); transform: scale(1.06) }
.chk input:checked + .box svg { stroke-dashoffset: 0 }
.chk input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px }
.legend div { display: flex; gap: 8px; align-items: center }
.note { font-size: 13.5px; color: var(--muted); margin: 0 }

/* ---------- quiz ---------- */
.qlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px }
.qcard { padding: 24px; display: grid; gap: 12px }
.qcard h3 { font-size: 24px }
.qcard .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.player { padding: clamp(22px, 4vw, 40px); display: grid; gap: 22px; max-width: 820px }
.player .top { display: flex; justify-content: space-between; font: 400 12.5px var(--f-mono); color: var(--muted) }
.prog { height: 3px; border-radius: 3px; background: var(--line-2); overflow: hidden }
.prog i { display: block; height: 100%; background: var(--ink); transition: width .5s var(--ease) }
.qtext { font: 400 clamp(20px, 2.6vw, 25px)/1.45 var(--f-display); min-height: 4.4em; overflow-x: auto }
.qtext.in { animation: rv .45s var(--ease) both }
.ans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.ans button { height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 500 19px var(--f-display); transition: border-color .2s, background .2s, transform .2s var(--ease) }
.ans button:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px) }
.ans button.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); animation: pop .4s var(--ease) }
.ans button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); animation: shake .4s }
@keyframes pop { 50% { transform: scale(1.03) } }
@keyframes shake { 20%, 60% { transform: translateX(-5px) } 40%, 80% { transform: translateX(5px) } }
.fb { min-height: 1.5em; font-weight: 500 }
.fb.ok { color: var(--ok) } .fb.ko { color: var(--bad) }
.player .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.big { font: 400 48px/1 var(--f-display) }

/* ---------- palette ---------- */
.pal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(8, 10, 14, .42); backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s }
.pal-bg.on { opacity: 1; visibility: visible; transition: opacity .2s }
.pal { position: fixed; z-index: 61; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12vh); width: min(640px, calc(100vw - 32px)); translate: -50% 0; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); overflow: hidden;
  opacity: 0; visibility: hidden; transform: translateY(-10px) scale(.97); transition: opacity .18s, transform .28s var(--ease), visibility 0s .28s }
.pal.on { opacity: 1; visibility: visible; transform: none; transition: opacity .18s, transform .3s var(--ease) }
.pal .in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line) }
.pal input { flex: 1; min-width: 0; height: 56px; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 17px var(--f-body) }
.pal input::placeholder { color: var(--muted) }
.pal .res { max-height: min(56vh, 480px); overflow-y: auto; padding: 8px }
.pal h5 { margin: 8px 10px 4px; font: 500 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.pal .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); cursor: pointer }
.pal .r small { grid-column: 1; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pal .r .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 14.5px }
.pal .r .k { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 400 11px var(--f-mono); color: var(--muted) }
.pal .r.sel { background: var(--line-2) }
.pal mark { background: transparent; color: var(--accent); font-weight: 600 }
.pal .hint { display: flex; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); font: 400 11.5px var(--f-mono); color: var(--muted) }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); translate: -50% 0; width: max-content; max-width: min(560px, calc(100vw - 32px));
  display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg); font-size: 14px; line-height: 1.45;
  opacity: 0; transform: translateY(16px); visibility: hidden; transition: opacity .2s, transform .35s var(--ease), visibility 0s .35s }
.toast.on { opacity: 1; transform: none; visibility: visible; transition: opacity .2s, transform .35s var(--ease) }
.toast b { font-weight: 600 }
.toast kbd { font: 500 11.5px var(--f-mono); border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); border-radius: 5px; padding: 0 5px }
.toast button { color: inherit; opacity: .6; margin-left: 4px }

/* ---------- PDF viewer (private page only) ---------- */
.pv { position: fixed; inset: 0; z-index: 80; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--bg);
  opacity: 0; visibility: hidden; transform: translateY(14px) scale(.99); transition: opacity .2s, transform .32s var(--ease), visibility 0s .32s }
.pv.on { opacity: 1; visibility: visible; transform: none; transition: opacity .2s, transform .32s var(--ease) }
.pv-bar { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: var(--glass); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px) }
.pv-t { min-width: 0; flex: 1; display: grid; gap: 1px }
.pv-t .w { font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.pv-t b { font: 500 16px/1.3 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pv-c { display: flex; align-items: center; gap: 4px; flex: none }
.pv-c .pg { font: 400 12.5px var(--f-mono); color: var(--muted); min-width: 74px; text-align: center; font-variant-numeric: tabular-nums }
.pv-body { overflow: auto; padding: 22px max(16px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px); scroll-behavior: auto; overscroll-behavior: contain }
.pv-pages { display: grid; gap: 14px; justify-items: center; margin: 0 auto }
.pv-page { position: relative; width: 100%; background: #fff; border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .4s }
.pv-page canvas { display: block; width: 100%; height: 100% }
.pv-page .n { position: absolute; right: 8px; bottom: 6px; font: 400 10.5px var(--f-mono); color: #8a8f99 }
.pv-page.target { box-shadow: 0 0 0 3px var(--accent), var(--shadow-lg) }
.pv-msg { display: grid; place-items: center; gap: 10px; padding: 80px 20px; color: var(--muted); text-align: center }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
@media (max-width: 640px) { .pv-c .zoom { display: none } .pv-c .pg { min-width: 58px } .pv-body { padding-inline: 8px } }
footer { border-top: 1px solid var(--line); padding-block: 22px 40px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between }
footer a { color: inherit }

@media (max-width: 1240px) { .kbtn kbd, .kbtn .lb { display: none } .kbtn { padding: 0 10px } }
@media (max-width: 1080px) {
  .topnav { display: none }
  .tools { margin-left: auto }
  .burger { display: grid }
}
@media (max-width: 980px) { .duo { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .stats div:nth-child(3) { border-left: 0 }
  .stats div:nth-child(n+3) { border-top: 1px solid var(--line) }
  ol.items > li { grid-template-columns: 28px minmax(0, 1fr); gap: 8px 12px; padding: 14px 14px 14px 12px }
  ol.items > li .chk { grid-column: 2 }
  .num { width: 26px; height: 26px; font-size: 12px }
  .part-h { top: calc(env(safe-area-inset-top, 0px) + 60px); padding-block: 12px 10px }
  .part-h h3 { font-size: 20px }
  .clock { border: 0; background: none; padding: 0 2px; font-size: 13.5px }
  .brand small { display: none }
  .brand b { font-size: 16.5px }
  .bar .wrap { gap: 10px }
  .tools { gap: 2px }
  .part-h h3 { white-space: nowrap }
  .part-h.stuck .n, .part-h .pos .x { display: none }
  .week { grid-template-columns: minmax(0, 1fr); padding: 22px }
  .ring { display: none }

^3)$ est une base de $(\\mathbb R_3[X],+,.)$", "tags": ["A"], "links": [{"label": "Prop. 31", "file": "cours/preuveschap3.pdf", "page": 25, "find": "Proposition 31", "of": 57, "title": "Proposition 31 - Base canonique de (R3[X], +, .)"}]}, {"n": 4, "text": "Toute famille réduite à un vecteur non nul est libre", "tags": ["C"], "links": [{"label": "Prop. 19", "file": "cours/chap3.pdf", "page": 24, "find": "Proposition 19", "of": 42, "title": "Proposition 19 - Liberté de toute famille réduite à un vecteur non nul"}]}, {"n": 5, "hp": true, "text": "Toute famille de polynômes à degrés échelonnés est libre", "tags": ["A"], "links": [{"label": "Prop. 23", "file": "cours/preuveschap3.pdf", "page": 17, "find": "Proposition 23", "of": 57, "title": "Proposition 23 - Famille de polynômes à degrés échelonnés (HP)"}]}, {"n": 6, "text": "Pour tout $\\lambda\\in\\mathbb R$, $\\lambda.0_E = 0_E$", "tags": ["A"], "links": [{"label": "Prop. 1", "file": "cours/preuveschap3.pdf", "page": 1, "find": "Proposition 1", "of": 57, "title": "Proposition 1 - Règles de calculs dans un espace vectoriel réel"}]}, {"n": 7, "text": "Une famille est liée si et seulement si l'un de ses vecteurs est combinaison linéaire des autres", "tags": ["A"], "links": [{"label": "Prop. 17", "file": "cours/preuveschap3.pdf", "page": 11, "find": "Proposition 17", "of": 57, "title": "Proposition 17 - Caractérisation des familles liées"}]}, {"n": 8, "text": "Caractérisation des bases par l'existence et l'unicité de l'écriture comme combinaison linéaire", "tags": ["A"], "links": [{"label": "Prop. 24", "file": "cours/preuveschap3.pdf", "page": 19, "find": "Proposition 24", "of": 57, "title": "Proposition 24 - Conséquence de la déﬁnition, coordonnées d’un vecteur"}]}, {"n": 9, "text": "$E$ est de dimension $n$ si et seulement s'il existe une application linéaire bijective de $E$ dans $\\mathbb R^n$", "tags": ["A"], "links": [{"label": "Prop. 39", "file": "cours/preuveschap3.pdf", "page": 35, "find": "Proposition 39 -", " function colleDates(c) { const m = c.dates.match(/(\d\d)\/(\d\d)\/(\d{4}).*?(\d\d)\/(\d\d)\/(\d{4})/); return m ? [new Date(+m[3], +m[2] - 1, +m[1]), new Date(+m[6], +m[5] - 1, +m[4])] : null }
function currentColle() {
  const d = DATA.colles.map(c => ({ c, d: colleDates(c) })).filter(x => x.d);
  return (d.find(x => x.d[0] <= TODAY && TODAY <= x.d[1]) || d.find(x => x.d[0] > TODAY) || d[d.length - 1])?.c;
}
const isLive = c => { const d = c && colleDates(c); return d && d[0] <= TODAY && TODAY <= d[1] };
function upcoming() {
  const out = [];
  for (const s of SECTIONS) if (s.id === "dm" || s.id === "ds") for (const g of s.groups) for (const it of g.items) {
    const m = it.label.match(/\(?(?:à rendre )?le (\d\d|xx)\/(\d\d)\/(\d{4})\)?/);
    if (!m) continue;
    const fuzzy = m[1] === "xx", date = new Date(+m[3], +m[2] - 1, fuzzy ? 28 : +m[1]);
    const what = it.label.replace(m[0], "").replace(/\s+/g, " ").replace(/\s*:\s*/, " · ").replace(/ · $/, "").trim();
    if (date >= TODAY) out.push({ date, fuzzy, what, kind: s.id === "dm" ? "Devoir maison à rendre" : "Devoir sur table", route: s.route });
  }
  for (const c of DATA.colles) { const d = colleDates(c); if (d && d[1] >= TODAY) out.push({ date: d[0], fuzzy: false, what: `Colle · semaine ${c.week}`, kind: c.title, route: "colles", week: c.week }); }
  return out.sort((a, b) => a.date - b.date).slice(0, 5);
}
const doneKeys = c => [...c.proofs.map(it => `done-${c.week}-p-${it.n}`), ...c.exercises.map(it => `done-${c.week}-e-${it.n}`)];
const doneCount = c => { const k = doneKeys(c); return [k.filter(x => store.get(x, false)).length, k.length] };

function renderNav(active) {
  const ul = $("#primary");
  if (!ul.children.length) {

        n.menu === "cours" ? COURS().filter(i => i.links.length).map(it => `<a href="#cours" data-chap="${chapNo(it)}">${chapNo(it)}. ${esc(chapTitle(it))}</a>`).join("") + `<a href="#quizz">Quiz Vrai/Faux</a>`
        : n.menu === "colles" ? DATA.weeks.filter(w => w.url).slice(-6).reverse().map(w => `<a href="#colles" data-week="${w.week}">Semaine ${w.week} · ${esc(w.label)}</a>`).join("") + `<a href="#colles">Toutes les semaines</a>`
        : n.routes.map(r => `<a href="#${r}">${esc(PAGE_TITLE[r] || byRoute(r).name)}</a>`).join("")}</div></div></div>`
        : `<a class="lnk" href="#${n.route}">${n.label}</a>`).join("");
  }
  $$("#primary > li").forEach(li => {
    const n = NAV[+li.dataset.nav], on = n.route === active || (n.routes || []).includes(active);
    $(".nav-btn", li).toggleAttribute("aria-current", false);
    if (on) $(".nav-btn", li).setAttribute("aria-current", "page");

}
function moveIndicator(target) {
  const ind = $("#ind"); if (!ind) return;
  const el = target || $("#primary .nav-btn[aria-current]");
  if (!el) { ind.style.opacity = 0; return; }
  const ul = $("#primary").getBoundingClientRect(), r = el.getBoundingClientRect();
  ind.style.opacity = 1; ind.style.left = (r.left - ul.left + 12) + "px"; ind.style.width = (r.width - 24) + "px";
}
let closeTimer = null;
function closeMenus(except) { $$("#primary > li.open").forEach(li => { if (li !== except) { li.classList.remove("open"); $(".nav-btn", li).setAttribute("aria-expanded", "false") } }) }
function openMenu(li) { clearTimeout(closeTimer); closeMenus(li); li.classList.add("open"); $(".nav-btn", li).setAttribute("aria-expanded", "true") }
function wireMenus() {
  const hover = matchMedia("(hover: hover)").matches;
  $$("#primary > li").forEach(li => {
    if (!$(".panel", li)) { li.addEventListener("mouseenter", () => { closeMenus(); moveIndicator($(".nav-btn", li)) }); return; }
    const b = $(".nav-btn", li);
    b.addEventListener("click", e => { e.stopPropagation(); li.classList.contains("open") ? closeMenus() : openMenu(li) });
    if (hover) {
      li.addEventListener("mouseenter", () => { openMenu(li); moveIndicator(b) });
      li.addEventListener("mouseleave", () => { closeTimer = setTimeout(() => { closeMenus(); moveIndicator() }, 180) });
    }
    li.addEventListener("keydown", e => {
      const items = $$(".panel a", li), i = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown") { e.preventDefault(); openMenu(li); (items[i + 1] || items[0]).focus() }
      if (e.key === "ArrowUp") { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus() }
      if (e.key === "Escape") { closeMenus(); b.focus() }
    });
  });
  $("#primary").addEventListener("mouseleave", () => moveIndicator());
  document.addEventListener("click", e => { if (!e.target.closest("#primary")) closeMenus() });
}
function sheet(on) {

/* year calendar: one square per day from the start of the year to the BCE written exams */
const YEAR_START = new Date(2026, 8, 1);
const BCE_PAST = [["2023", "26/04"], ["2024", "22/04"], ["2025", "23/04"], ["2026", "22/04"]];
const BCE = { date: new Date(2027, 3, 23), official: false };  // average start day of the four previous sessions
function calendarHTML() {
  const DAY = 864e5, days = d => Math.round((d - YEAR_START) / DAY);
  const total = days(BCE.date) + 1, done = Math.max(0, Math.min(total, days(TODAY) + 1)), left = Math.max(0, Math.round((BCE.date - TODAY) / DAY));
  const lead = (YEAR_START.getDay() + 6) % 7, weeks = Math.ceil((lead + total) / 7);
  const sq = [], months = [];
  for (let i = 0; i < lead; i++) sq.push('<i class="sq pad"></i>');
  for (let i = 0; i < total; i++) {
    const d = new Date(YEAR_START.getFullYear(), YEAR_START.getMonth(), YEAR_START.getDate() + i), col = Math.floor((lead + i) / 7) + 1;
    if (d.getDate() === 1 || i === 0) months.push(`<span style="grid-column:${col}">${MONTHS[d.getMonth()].replace(".", "")}</span>`);
    const cls = i === total - 1 ? "goal" : i < done - 1 ? "past" : i === done - 1 ? "today" : "";
    const label = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + (i === total - 1 ? " · écrits BCE (estimés)" : "");
    sq.push(`<i class="sq ${cls}" style="--k:${i}" title="${esc(label)}"></i>`);
  }
  const fmt = d => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return `<section ${rvc("card cal")} aria-label="Avancée de l'année">
    <div class="cal-h"><div><div class="eyebrow">${esc(TODAY.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))}</div>
      <div class="big" style="margin-top:14px">J−${left}<span>avant les écrits BCE</span></div>
      <div class="sub">${BCE.official ? "Écrits BCE le" : "Estimés au"} <b>${esc(fmt(BCE.date))}</b></div></div>
      <div class="pct"><b>${Math.round(100 * done / total)} %</b><span>${done} jours passés · ${total - done} à venir</span></div></div>
    <div class="cal-g" style="--w:${weeks}"><span></span><div class="months">${months.join("")}</div>
      <div class="wd"><span>L</span><span></span><span>M</span><span></span><span>V</span><span></span><span>D</span></div>
      <div class="days" role="img" aria-label="${done} jours passés sur ${total}">${sq.join("")}</div></div>
    <div class="cal-f"><div class="lg"><span><i class="sq past"></i>jours passés</span><span><i class="sq today"></i>aujourd'hui</span><span><i class="sq"></i>à venir</span><span><i class="sq goal"></i>écrits BCE</span></div>
      ${BCE.official ? "" : `<span>Date estimée : moyenne des débuts d'écrits ${BCE_PAST.map(([y, d]) => `${y} (${d})`).join(", ")}.</span>`}</div>
  </section>`;
}

      ? `Le PDF s'ouvre au début. <b>« ${esc(find)} »</b> est copié : touche la barre d'adresse, colle, puis choisis <b>Sur cette page</b> (page ${page}).`
      : SAFARI
      ? `Safari ouvre le PDF au début. <b>« ${esc(find)} »</b> est copié : <kbd>⌘F</kbd>, <kbd>⌘V</kbd>, <kbd>↵</kbd> et tu es à la page ${page}.`
      : `Ouverture à la <b>page ${page}</b>. Si le PDF s'ouvre au début, <b>« ${esc(find)} »</b> est copié : <kbd>${MAC ? "⌘" : "Ctrl+"}F</kbd> puis colle.`, NOPAGE ? 9000 : 5000);
    return;
  }
  if (e.target.closest("#toast button")) { $("#toast").classList.remove("on"); return; }
  const wk = e.target.closest("[data-week]"), ch = e.target.closest("[data-chap]");
  if (wk || ch || e.target.closest(".r, .msheet a, .panel a")) { closeMenus(); sheet(false); if (e.target.closest(".r")) palette(false) }
  if (ch) { pendingChap = ch.dataset.chap; if (location.hash === "#cours") { e.preventDefault(); render() } return; }
  if (wk) {
    colleWeek = +wk.dataset.week; store.set("week", colleWeek);
    if (wk.dataset.item) pendingItem = wk.dataset.item;
    if (wk.closest("#weeks")) { e.preventDefault(); render(true); placePill(true); return; }
    if (location.hash === "#colles") { e.preventDefault(); render() }
    return;
  }
  const f = e.target.closest(".seg button"); if (f) { colleFilter = f.dataset.f; store.set("filter", colleFilter); applyFilter(true); return; }
  const qz = e.target.closest("[data-quiz]"); if (qz) { startQuiz(qz.dataset.quiz, !!qz.dataset.shuffle); return; }
  const an = e.target.closest("[data-ans]"); if (an) { answer(an.dataset.ans === "1"); return; }
  const act = e.target.closest("[data-act]");
  if (act) { if (act.dataset.act === "next") nextQ(); if (act.dataset.act === "quit") { quiz = null; render() } if (act.dataset.act === "retry") { quiz = { ...quiz, order: quiz.wrong, i: 0, score: 0, answered: null, wrong: [] }; render() } return; }
  const accB = e.target.closest(".acc > button"); if (accB) { const a = accB.parentElement, on = !a.classList.contains("open"); $$(".acc").forEach(x => x.classList.remove("open")); a.classList.toggle("open", on); accB.setAttribute("aria-expanded", String(on)); return; }
});
document.addEventListener("change", e => {
  const c = e.target.closest("input[data-key]"); if (!c) return;
  store.set(c.dataset.key, c.checked); c.closest("li").classList.toggle("done", c.checked);
  const ann = DATA.colles.find(x => x.week === colleWeek);
  if (ann) { const [d, t] = doneCount(ann); const k = $("#kpi-done"); if (k) k.innerHTML = `${d}<span style="font-size:.55em;color:var(--muted)"> / ${t}</span>` }
  if (colleFilter === "todo") setTimeout(() => applyFilter(), 350);
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== "checkbox";
  if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !typing)) { e.preventDefault(); palette(!$("#pal").classList.contains("on")); return; }
  if ($("#pv").classList.contains("on")) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goPage(currentPage() + 1) }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goPage(currentPage() - 1) }
    return;
  }
  if ($("#pal").classList.contains("on")) {
    const items = $$("#res .r");
    if (e.key === "Escape") palette(false);
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % Math.max(1, items.length); items.forEach(x => x.classList.toggle("sel", +x.dataset.idx === sel)); $("#res .sel")?.scrollIntoView({ block: "nearest" }) }
    else if (e.key === "Enter") { e.preventDefault(); $("#res .sel")?.click() }
    return;
  }
  if (e.key === "Escape") { closeMenus(); sheet(false) }
  if (quiz && !typing) { if (e.key === "v" || e.key === "V") answer(true); else if (e.key === "f" || e.key === "F") answer(false); else if (e.key === "Enter") nextQ() }
});
$("#q").addEventListener("input", () => { sel = 0; searchRender() });
$("#res").addEventListener("mousemove", e => { const r = e.target.closest(".r"); if (r && +r.dataset.idx !== sel) { sel = +r.dataset.idx; $$("#res .r").forEach(x => x.classList.toggle("sel", x === r)) } });
$("#open-search").addEventListener("click", () => palette(true));
$("#pal-bg").addEventListener("click", () => palette(false));
$("#burger").addEventListener("click", () => sheet(true));
$("#sheet-bg").addEventListener("click", () => sheet(false));
document.addEventListener("click", e => { if (e.target.closest("#close-sheet")) sheet(false) });
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme);
});
{ const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t; }
addEventListener("hashchange", () => { if (location.hash !== "#quizz") quiz = null; render(); scrollTo({ top: 0 }) });
addEventListener("resize", () => { moveIndicator(); placePill(false) });
$("#stamp").textContent = "Mis à jour le " + DATA.updated;
render();

/* clock: hh:mm:ss, each digit rolls up to its new value; paused while the page is hidden */
{
  const el = $("#clock"), MAX = [2, 9, 5, 9, 5, 9];
  el.innerHTML = MAX.map((m, i) => `${i && i % 2 === 0 ? `<span class="co" aria-hidden="true">:</span>` : ""}<span class="dg ${i > 3 ? "s" : ""}" aria-hidden="true"><span class="rl">${[...Array(m + 1).keys(), 0].map(d => `<span>${d}</span>`).join("")}</span></span>`).join("");
  const reels = $$(".rl", el), cur = MAX.map(() => -1);
  let timer = 0;
  const snap = (r, k) => { r.classList.add("snap"); r.style.setProperty("--k", k); r.offsetWidth; r.classList.remove("snap") };
  reels.forEach((r, i) => r.addEventListener("transitionend", () => { if (cur[i] === 0 && +r.style.getPropertyValue("--k") === MAX[i] + 1) snap(r, 0) }));
  function show(now, animate) {
    const p = n => String(n).padStart(2, "0"), s = p(now.getHours()) + p(now.getMinutes()) + p(now.getSeconds());
    el.setAttribute("aria-label", `Il est ${s.slice(0, 2)} h ${s.slice(2, 4)}`);
    el.classList.toggle("blink", now.getSeconds() % 2 === 1);
    [...s].forEach((c, i) => {
      const d = +c, r = reels[i];
      if (d === cur[i]) return;
      if (+r.style.getPropertyValue("--k") === MAX[i] + 1) snap(r, 0);  // a wrap whose transition never ended
      if (!animate) snap(r, d);
      else r.style.setProperty("--k", d === 0 && cur[i] === MAX[i] ? MAX[i] + 1 : d);  // 9 → 0 rolls on to the trailing 0
      cur[i] = d;
    });
  }
  function tick() { show(new Date(), true); timer = setTimeout(tick, 1000 - Date.now() % 1000 + 8) }
  function start() { clearTimeout(timer); show(new Date(), false); timer = setTimeout(tick, 1000 - Date.now() % 1000 + 8) }
  document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : start());
  start();
}
