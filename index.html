<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c4fc4'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px system-ui, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
</head>
<body>
<title>Maths ECG 2 Hoche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: left rail mirroring the professor's menu (a scrolling tab bar on phones) + one main column.
   Identity: French school paper — Seyès ruling in the hero, fountain-pen blue ink, a highlighter for "this week". */
:root {
  --bg: #f3f5fa;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --ink: #18203a;
  --muted: #5b6480;
  --line: #e1e5ef;
  --pen: #2c4fc4;            /* encre de stylo */
  --pen-soft: #e8edfb;
  --margin: #e0487a;         /* la marge rose du cahier */
  --seyes: #c9d6f2;          /* lignes Seyès */
  --hi: #ffe36e;             /* surligneur */
  --hi-ink: #3a2f00;
  --hi-mark: #ffe36e;         /* surligneur sous un titre */
  --ok: #18825a;  --ok-bg: #e0f4ea;
  --bad: #c23a3a; --bad-bg: #fbe5e5;
  --t-a: #2c4fc4;  --t-a-bg: #e8edfb;
  --t-c: #18825a;  --t-c-bg: #e0f4ea;
  --t-ac: #9a5b00; --t-ac-bg: #fdf0d8;
  --t-td: #7a3cc0; --t-td-bg: #f1e8fb;
  --hp: #8e4a5c;   --hp-bg: #f8e8ed;
  /* section hues (icon chips) */
  --s1: #2c4fc4; --s2: #18825a; --s3: #c2410c; --s4: #7a3cc0; --s5: #0e7490; --s6: #b4235a;
  --shadow: 0 1px 2px rgba(24, 32, 58, .06), 0 4px 16px rgba(24, 32, 58, .05);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1320; --surface: #171c2c; --surface-2: #1c2234; --ink: #e6e9f2; --muted: #9aa3bd; --line: #2a3148;
  --pen: #8fa8ff; --pen-soft: #222c4d; --margin: #ff7aa6; --seyes: #2a3556; --hi: #d9b92e; --hi-ink: #1d1700; --hi-mark: rgba(217, 185, 46, .38);
  --ok: #5fd3a0; --ok-bg: #163428; --bad: #ff8a8a; --bad-bg: #3a1c1f;
  --t-a: #a9bcff; --t-a-bg: #222c4d; --t-c: #6fd8a8; --t-c-bg: #163428; --t-ac: #f2c46d; --t-ac-bg: #3a2c12;
  --t-td: #cfa8ff; --t-td-bg: #2e2244; --hp: #f0a6bb; --hp-bg: #3b222b;
  --s1: #8fa8ff; --s2: #5fd3a0; --s3: #ff9b6a; --s4: #cfa8ff; --s5: #5fd0e6; --s6: #ff86b0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1320; --surface: #171c2c; --surface-2: #1c2234; --ink: #e6e9f2; --muted: #9aa3bd; --line: #2a3148;
  --pen: #8fa8ff; --pen-soft: #222c4d; --margin: #ff7aa6; --seyes: #2a3556; --hi: #d9b92e; --hi-ink: #1d1700; --hi-mark: rgba(217, 185, 46, .38);
  --ok: #5fd3a0; --ok-bg: #163428; --bad: #ff8a8a; --bad-bg: #3a1c1f;
  --t-a: #a9bcff; --t-a-bg: #222c4d; --t-c: #6fd8a8; --t-c-bg: #163428; --t-ac: #f2c46d; --t-ac-bg: #3a2c12;
  --t-td: #cfa8ff; --t-td-bg: #2e2244; --hp: #f0a6bb; --hp-bg: #3b222b;
  --s1: #8fa8ff; --s2: #5fd3a0; --s3: #ff9b6a; --s4: #cfa8ff; --s5: #5fd0e6; --s6: #ff86b0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
a { color: var(--pen) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; border-radius: 6px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em }
.app { max-width: 1180px; margin: 0 auto; padding-block: 20px 64px; display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px; align-items: start }

/* ---------- rail ---------- */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0 }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; text-decoration: none; color: var(--ink) }
.brand .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--pen); color: var(--surface); display: grid; place-items: center; font: 800 20px/1 var(--f-display) }
.brand b { font: 700 17px/1.1 var(--f-display); display: block }
.brand small { color: var(--muted); font-size: 12.5px }
.menu { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none }
.menu a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px }
.menu a:hover { background: var(--surface) }
.menu a[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow) }
.menu .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent) }
.menu .ico svg { width: 17px; height: 17px }
.menu .count { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.rail .foot { font-size: 12.5px; color: var(--muted); padding: 6px 10px; display: grid; gap: 6px }

/* ---------- top bar ---------- */
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; min-width: 0 }
#view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px }
.topbar { display: flex; gap: 12px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 4px 8px }
.search { flex: 1; position: relative; min-width: 0 }
.search svg { position: absolute; left: 13px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none }
.search input { width: 100%; font: 16px var(--f-body); padding: 11px 14px 11px 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.search input::placeholder { color: var(--muted) }
.search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px }

/* ---------- generic blocks ---------- */
.page-head { display: grid; gap: 6px }
.page-head .kicker { display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.page-head h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 800; line-height: 1.08 }
.page-head p { margin: 0; color: var(--muted); max-width: 62ch }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0 }
.group { display: grid; gap: 10px }
.group > h2 { font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 10px }
.group > h2 .n { font: 500 12px var(--f-mono); color: var(--muted) }
.group.sub > h2 { font-size: 16.5px; color: var(--muted) }
.rows { list-style: none; margin: 0; padding: 0 }
.rows > li { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line) }
.rows > li:last-child { border-bottom: 0 }
.rows .what { flex: 1 1 280px; min-width: 0; display: grid; gap: 3px }
.rows .what b { font-weight: 600 }
.rows .what .sub { font-size: 13.5px; color: var(--muted) }
.rows .what ul.notes { margin: 4px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); display: grid; gap: 2px }
.rows .acts { display: flex; flex-wrap: wrap; gap: 6px }
.rows li.soon .what b { color: var(--muted); font-weight: 500 }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/1 var(--f-mono); padding: 5px 8px; border-radius: 999px; white-space: nowrap }
.pill.soon { color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line) }
.pill.new { color: var(--hi-ink); background: var(--hi) }
.pill.ver { color: var(--muted); background: var(--surface-2) }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 14px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--pen); color: var(--pen) }
.btn svg { width: 15px; height: 15px; flex: none }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--surface) }
.btn.primary:hover { color: var(--surface); filter: brightness(1.08) }
.btn.k-A { color: var(--t-a); background: var(--t-a-bg); border-color: transparent }
.btn.k-Ac { color: var(--t-ac); background: var(--t-ac-bg); border-color: transparent }
.btn.k-TD { color: var(--t-td); background: var(--t-td-bg); border-color: transparent }
.btn.k-C { color: var(--t-c); background: var(--t-c-bg); border-color: transparent }
.btn[class*="k-"]:hover { filter: brightness(.96); border-color: currentColor }
.btn .pg { font: 500 11.5px var(--f-mono); opacity: .75 }
.empty { color: var(--muted); font-style: italic; margin: 0 }

/* ---------- accueil ---------- */
.hero { position: relative; overflow: hidden; padding: 26px clamp(18px, 4vw, 34px) 26px clamp(30px, 6vw, 58px);
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent calc(clamp(18px, 4vw, 40px) - 1px), var(--margin) calc(clamp(18px, 4vw, 40px) - 1px), var(--margin) clamp(18px, 4vw, 40px), transparent clamp(18px, 4vw, 40px)),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--seyes) 31px 32px),
    repeating-linear-gradient(180deg, transparent 0 7px, color-mix(in srgb, var(--seyes) 45%, transparent) 7px 8px);
  display: grid; gap: 14px }
.hero .date { font: 500 12.5px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
.hero h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; line-height: 1.04 }
.hero h1 mark { background: linear-gradient(180deg, transparent 55%, var(--hi-mark) 55% 92%, transparent 92%); color: inherit; padding: 0 .08em }
.hero p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 16.5px }
.next-colle { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 20px; align-items: center; padding: 18px 20px; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow) }
.next-colle .lbl { font: 500 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--margin) }
.next-colle h2 { font-size: 22px; font-weight: 700; margin-top: 4px }
.next-colle .meta { color: var(--muted); font-size: 14.5px; margin-top: 2px }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin-top: 10px }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px }
.bar-lbl { font-size: 13px; color: var(--muted); margin-top: 5px }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px }
.panel { padding: 18px 20px; display: grid; gap: 12px; align-content: start }
.panel > h2 { font-size: 18px; font-weight: 700 }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.timeline li { display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center }
.timeline .day { text-align: center; border-radius: 10px; padding: 6px 0; background: var(--surface-2); border: 1px solid var(--line); line-height: 1.05 }
.timeline .day b { display: block; font: 800 20px var(--f-display) }
.timeline .day span { font: 500 10.5px var(--f-mono); text-transform: uppercase; color: var(--muted) }
.timeline .day.fuzzy b { font-size: 15px; padding-block: 3px }
.timeline .what b { font-weight: 600; display: block }
.timeline .what span { font-size: 13.5px; color: var(--muted) }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px }
.tile { display: grid; gap: 10px; padding: 16px; text-decoration: none; color: var(--ink); border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); transition: transform .15s, box-shadow .15s }
.tile:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--c) 45%, var(--line)) }
.tile .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent) }
.tile .ico svg { width: 20px; height: 20px }
.tile b { font: 700 16.5px var(--f-display) }
.tile span { font-size: 13.5px; color: var(--muted); line-height: 1.35 }
.prof { padding: 18px 20px; display: grid; gap: 8px; font-size: 15px }
.prof p { margin: 0 }
.prof .mail { font: 500 14px var(--f-mono); user-select: all; background: var(--surface-2); padding: 3px 8px; border-radius: 6px }

/* ---------- cours ---------- */
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px }
.chap { padding: 16px 18px 18px; display: grid; gap: 12px; align-content: start; position: relative }
.chap .no { font: 800 44px/0.9 var(--f-display); color: var(--pen); font-variant-numeric: tabular-nums }
.chap.soon .no { color: var(--line) }
.chap h3 { font-size: 17px; font-weight: 700; line-height: 1.25 }
.chap .acts { display: flex; flex-wrap: wrap; gap: 6px }
.chap .extra { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); align-items: center }
.chap .extra a { font-weight: 600; text-decoration: none }
.chap .tag-soon { position: absolute; top: 16px; right: 16px }

/* ---------- colles ---------- */
.weeks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin }
.weeks button { flex: none; display: grid; gap: 1px; min-width: 58px; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: center }
.weeks button b { font: 700 15px var(--f-display) }
.weeks button span { font: 500 10px var(--f-mono); color: var(--muted); text-transform: uppercase }
.weeks button.off { opacity: .5 }
.weeks button.ann span { color: var(--ok) }
.weeks button.now { box-shadow: inset 0 -3px 0 var(--hi) }
.weeks button[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--surface) }
.weeks button[aria-pressed="true"] span { color: var(--surface); opacity: .85 }
.sheet { padding: 22px clamp(16px, 3.5vw, 30px); display: grid; gap: 18px }
.sheet-head { display: grid; gap: 6px }
.sheet-head h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 800 }
.sheet-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 14.5px; align-items: center }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.kpi { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line) }
.kpi b { display: block; font: 800 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums }
.kpi span { font-size: 13px; color: var(--muted) }
.week-docs { display: grid; gap: 8px; padding: 14px 16px; border-radius: 12px; background: var(--pen-soft) }
.week-docs .lbl { font: 500 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pen) }
.wd-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between }
.wd-ch { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1 1 220px; font-size: 15px }
.wd-ch b { font: 700 15px var(--f-display); white-space: nowrap }
.wd-row .acts { display: flex; flex-wrap: wrap; gap: 6px }
.filters { display: flex; flex-wrap: wrap; gap: 6px }
.filters button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.sheet h3 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; padding-top: 4px }
.sheet h3::after { content: ""; flex: 1; height: 1px; background: var(--line) }
ol.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
ol.items > li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); align-items: start }
ol.items > li.is-done { background: var(--surface-2) }
ol.items > li.is-done .stmt { color: var(--muted) }
.num { font: 800 17px/1.5 var(--f-display); color: var(--muted); font-variant-numeric: tabular-nums }
.ibody { min-width: 0; display: grid; gap: 9px }
.stmt { overflow-x: auto; overflow-y: hidden; line-height: 1.6 }
.parts { margin: 0; padding-left: 20px; display: grid; gap: 10px }
.parts li { display: grid; gap: 6px }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.tag { font: 500 11.5px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; white-space: nowrap }
.tag.A { color: var(--t-a); background: var(--t-a-bg) } .tag.C { color: var(--t-c); background: var(--t-c-bg) }
.tag.Ac { color: var(--t-ac); background: var(--t-ac-bg) } .tag.TD { color: var(--t-td); background: var(--t-td-bg) }
.tag.HP { color: var(--hp); background: var(--hp-bg) }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--muted); padding: 2px 0; white-space: nowrap }
.check input { width: 18px; height: 18px; accent-color: var(--ok) }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; font-size: 13.5px; color: var(--muted); padding-top: 6px; border-top: 1px solid var(--line) }
.legend div { display: flex; gap: 8px; align-items: center }

/* ---------- quizz ---------- */
.quiz-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px }
.quiz-card { padding: 18px; display: grid; gap: 10px }
.quiz-card h3 { font-size: 19px; font-weight: 700 }
.quiz-card .best { font-size: 13.5px; color: var(--muted) }
.quiz-card .acts { display: flex; flex-wrap: wrap; gap: 8px }
.player { padding: 22px clamp(16px, 4vw, 32px); display: grid; gap: 18px }
.player .top { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center }
.player .progress { font: 500 13px var(--f-mono); color: var(--muted) }
.player .q { font-size: 18.5px; line-height: 1.6; min-height: 4.8em; overflow-x: auto }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.answers button { padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font: 700 18px var(--f-display); cursor: pointer }
.answers button:hover:not(:disabled) { border-color: var(--pen) }
.answers button.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok) }
.answers button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad) }
.feedback { min-height: 1.6em; font-weight: 600 }
.feedback.ok { color: var(--ok) } .feedback.ko { color: var(--bad) }
.player .foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center }
.score { font: 800 20px var(--f-display) }

/* ---------- search results ---------- */

que et transitive", "tags": ["A"], "links": [{"label": "Prop. 33", "file": "cours/preuveschap4.pdf", "page": 49}]}, {"n": 14, "hp": true, "text": "Puissances de deux matrices semblables", "tags": ["C"], "links": [{"label": "aussi en annexe : Prop. 12", "file": "cours/preuveschap4.pdf", "page": 21}]}, {"n": 15, "text": "Formule du binôme de Newton dans le contexte matriciel", "tags": ["A"], "links": [{"label": "Prop. 11", "file": "cours/preuveschap4.pdf", "page": 19}]}, {"n": 16, "hp": true, "text": "Toute matrice triangulaire supérieure stricte est nilpotente", "tags": ["A"], "links": [{"label": "Prop. 6", "file": "cours/preuveschap4.pdf", "page": 14}]}, {"n": 17, "text": "Inversibilité et inverse d'un produit de matrices inversibles, d'une puissance d'une matrice inversible", "tags": ["A"], "links": [{"label": "Prop. 14", "file": "cours/preuveschap4.pdf", "page": 24}]}, {"n": 18, "text": "Caractérisation de l'inversibilité des matrices carrées d'ordre 2 par le déterminant", "tags": ["A"], "links": [{"label": "Prop. 20", "file": "cours/preuveschap4.pdf", "page": 33}]}, {"n": 19, "hp": true, "text": "Inversibilité de toute matrice possédant un polynôme annulateur de coefficient constant non nul", "tags": ["A"], "links": [{"label": "Prop. 21", "file": "cours/preuveschap4.pdf", "page": 35}]}], "exercises": [{"n": 1, "text": "Pour tout $t\\in\\mathbb R$, calcul de $\\lim\\limits_{n\\to+\\infty}\\exp\\!\\big(-\\sqrt n\\,t+n(e^{t/\\sqrt n}-1)\\big)$", "tags": ["TD"], "links": [{"label": "TD 2 – Exercice 49", "file": "td/td2.pdf", "page": 6}]}, {"n": 2, "text": "$u_0=0$, $u_{n+1}=\\frac{1+u_n^2}{2}$ : convergence de $(u_n)$ et valeur de la limite", "tags": ["TD"], "links": [{"label": "TD 2 – Exercice 78", "file": "td/td2.pdf", "page": 9}]}, {"n": 3, "text": "L'intersection de deux sous-espaces vectoriels est un sous-espace vectoriel. Et la réunion ?", "tags": ["TD"], "links": [{"label": "TD 3 – Exercice 133", "file": "td/td3.pdf", "page": 14}]}, {"n": 4, "text": "Fonctions  des sous-ensembles de $\\Omega$ est inclus dans $\\mathcal{T}$.", "a": false}, {"s": "Pour tout ensemble-univers $\\Omega$, pour toute tribu $\\mathcal{T}$ sur $\\Omega$, $\\Omega$ est inclus dans $\\mathcal{T}$.", "a": false}, {"s": "Pour tout ensemble-univers $\\Omega$, pour toute tribu $\\mathcal{T}$ sur $\\Omega$, $\\Omega$ appartient à $\\mathcal{T}$.", "a": true}, {"s": "Pour tout ensemble-univers $\\Omega$, pour toute tribu $\\mathcal{T}$ sur $\\Omega$, $\\mathcal{T}\\neq \\emptyset$.", "a": true}, {"s": "Pour tout ensemble-univers $\\Omega$, l'ensemble $\\mathcal{P}(\\Omega)$ des sous-ensembles de $\\Omega$ est une tribu sur $\\Omega$.", "a": true}, {"s": "Pour tout ensemble-univers $\\Omega$, il existe un ensemble $\\mathcal{T}$ tel que $\\mathcal{T}$ est une tribu sur $\\Omega$.", "a": true}, {"s": "Il existe un ensemble-univers $\\Omega$ tel qu'il existe une unique tribu sur $\\Omega$.", "a": true}, {"s": "On appelle espace probabilisable tout couple $\\left(\\Omega,\\mathcal{T}\\right)$ où $\\Omega$ est un ensemble et $\\mathcal{T}$ est une tribu sur $\\Omega$.", "a": true}, {"s": "Pour tout ensemble-univers $\\Omega$, pour toute tribu $\\mathcal{T}$ sur $\\Omega$, $\\mathcal{T}$ est stable par intersection et union au plus dénombrable.", "a": true}, {"s": "Une intersection d'une famille au plus dénombrable d'événements relatif à une expérience aléatoire donnée notée (E) est un événement relatif à cette même expérience aléatoire.", "a": true}, {"s": "Une union d'une famille au plus dénombrable d'événements relatif à une expérience aléatoire donnée notée (E) est un événement relatif à cette même expérience aléatoire.", "a": true}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, $A$ est inclus dans $B$ si et seulement si la réalisation de $B$ implique celle de $A$.", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^ iste un espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$ et $\\left(A_i\\right)_{i\\in\\mathbb{N}}\\in\\mathcal{T}^{\\mathbb{N}}$ tels que $\\left\\{A_n,~n\\in\\mathbb{N}^*\\right\\}$ est un système complet d'événements.", "a": true}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout système complet d'événements $\\mathcal{S}$ (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$), pour tout $A\\in \\mathcal{S}$, $\\mathcal{S}\\setminus\\{A\\}$ est un système complet d'événements (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$).", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout système complet d'événements $\\mathcal{S}$ (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$), pour tout $A\\in \\mathcal{S}$, $\\mathcal{S}\\cup\\{A\\}$ est un système complet d'événements (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$).", "a": true}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout couple $(I,J)$ de parties de $\\mathbb{N}$, pour tout couple $\\left(\\left(A_i\\right)_{i\\in I},\\left(B_j\\right)_{j\\in J}\\right)$ de familles d'éléments de $\\mathcal{T}$ respectivement indexées par $I$ et par $J$, si $\\left\\{~A_i,~i\\in I~\\right\\}$ et $\\left\\{~B_j,~j\\in J~\\right\\}$ sont deux systèmes complets d'événements (relatifs à $\\left(\\Omega,\\mathcal{T}\\right)$), alors $\\left\\{~A_i\\cup B_j,~(i,j)\\in I\\times J~\\right\\}$ est un système complet d'événements (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$).", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout couple $(I,J)$ de parties de $\\mathbb{N}$, pour tout couple $\\left(\\left(A_i\\right)_{i\\in I},\\left(B_j\\right)_{j\\in J}\\right)$ de familles d'éléments de $\\mathcal{T}$, si $\\left\\{~A_i,~i\\in I~\\right\\}$ et $\\left\\{~B_j,~j\\in J~\\right\\}$ sont deux systèmes complets d'événements (relatifs à $\\left(\\Omega,\\mathcal{T}\\right)$), alors $\\left\\{~A_i\\cap B_j,~(i,j)\\in I\\times J~\\right\\}$ est un système complet d'événements (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$).", "a": true}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, toute probabilité sur $\\left(\\Omega,\\mathcal{T}\\right)$ est définie sur $\\Omega$.", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, toute probabilité sur $\\left(\\Omega,\\mathcal{T}\\right)$ est un nombre.", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour toute probabilité $\\mathbb{P}$ sur $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout $A\\in \\mathcal{P}(A)$, $\\mathbb{P}(A)$ est un nombre réel bien défini.", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, il existe une unique probabilité sur $\\left(\\Omega,\\mathcal{T}\\right)$.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, $\\mathbb{P}(\\emptyset)=0$ et $\\mathbb{P}(\\Omega)=0$.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, l'application $\\mathbb{Q}$ de $\\mathcal{T}$ dans $\\mathbb{R}$ définie par, pour tout $A\\in\\mathcal{T}$, $\\mathbb{Q}(A) = 1-\\mathbb{P}(A)$ est une probabilité sur $\\left(\\Omega,\\mathcal{T}\\right)$.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in \\mathcal{T}^2$, si $A\\cap B=\\emptyset$, alors $\\mathbb{P}(A\\cup B) = \\mathbb{P}(A)+\\mathbb{P}(B)$.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in \\mathcal{T}^2$, $\\mathbb{P}(A\\cup B) \\leqslant \\mathbb{P}(A)+\\mathbb{P}(B)$.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in \\mathcal{T}^2$, si $\\mathbb{P}(A)+\\mathbb{P}(B)=1$, alors $\\left\\{~A;B~\\right\\}$ forme un système complet d'événements (relatif à $\\left(\\Omega,\\mathcal{T}\\right)$).", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in \\mathcal{T}^2$, si $\\mathbb{P}(A\\cap B)=0$, alors $A\\cap B = \\emptyset$.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $\\left(A_n\\right)_{n\\in\\mathbb{N}}\\in \\mathcal{T}^{\\mathbb{N}}$, la série $\\displaystyle\\sum_{n\\geqslant 0}\\mathbb{P}\\left(A_n\\right)$ converge.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $\\left(A_n\\right)_{n\\in\\mathbb{N}}\\in \\mathcal{T}^{\\mathbb{N}}$, si les événements $A_n$ $(n\\in\\mathbb{N})$ sont deux à deux incompatibles, alors la série $\\displaystyle\\sum_{n\\geqslant 0}\\mathbb{P}\\left(A_n\\right)$ converge.", "a": true}, {"s": "Pour tout ensemble au plus dénombrable $\\Omega$, pour tout couple $\\left(\\mathbb{P},\\mathbb{Q}\\right)$ de probabilités sur $\\left(\\Omega,\\mathcal{P}(\\Omega)\\right)$, si, pour tout $\\omega\\in\\Omega$, $\\mathbb{P}\\left(\\left\\{\\omega\\right\\}\\right) = \\mathbb{Q}\\left(\\left\\{\\omega\\right\\}\\right)$, alors $\\mathbb{P} = \\mathbb{Q}$.", "a": true}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour tout couple $\\left(\\mathbb{P},\\mathbb{Q}\\right)$ de probabilités sur $\\left(\\Omega,\\mathcal{T}\\right)$, si, pour tout $\\omega\\in\\Omega$, $\\mathbb{P}\\left(\\left\\{\\omega\\right\\}\\right) = \\mathbb{Q}\\left(\\left\\{\\omega\\right\\}\\right)$, alors $\\mathbb{P} = \\mathbb{Q}$.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $A\\in\\mathcal{T}$, si $\\mathbb{P}(A)=1$, alors $A$ est certain.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $A\\in\\mathcal{T}$, si $\\mathbb{P}(A)=0$, alors $A$ est impossible.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, il existe $A\\in\\mathcal{T}$ tel que $A\\neq \\emptyset$ et $\\mathbb{P}(A)=0$.", "a": false}, {"s": "Il existe un espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$ tel qu'il existe $A\\in\\mathcal{T}$ tel que $A\\neq \\emptyset$ et $\\mathbb{P}(A)=0$.", "a": true}, {"s": "Pour tout ensemble-univers fini $\\Omega$, pour toute probabilisé $\\mathbb{P}$ sur $\\left(\\Omega,\\mathcal{P}(\\Omega)\\right)$, pour tout $\\omega\\in\\Omega$, $\\mathbb{P}\\left(\\left\\{\\omega\\right\\}\\right) = \\displaystyle\\frac{1}{card(\\Omega)}$.", "a": false}, {"s": "Pour tout ensemble-univers fini $\\Omega$, l'application $A\\mapsto \\displaystyle\\frac{card(A)}{card(\\Omega)}$ définit une probabilité sur l'espace probabilisable $\\left(\\Omega, \\mathcal{P}(\\Omega)\\right)$.", "a": true}, {"s": "Si on considère l'expérience aléatoire $(E)$ consistant à lancer indéfiniment une pièce de monnaie équilibrée, alors on peut supposer que l'on se trouve en situation d'équiprobabilité et munir tout espace probabilisable modélisant $(E)$ de la probabilité uniforme.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, si $A$ et $B$ sont $\\mathbb{P}$-indépendants, alors $\\mathbb{P}(A\\cup B) = \\mathbb{P}(A)+\\mathbb{P}(B)$.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, si $\\mathbb{P}(A\\cap B) = \\mathbb{P}(A)+\\mathbb{P}(B)$, alors $A$ et $B$ sont $\\mathbb{P}$-indépendants.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, si $\\mathbb{P}(A\\cap B) = \\mathbb{P}(A)\\mathbb{P}(B)$, alors $A$ et $B$ sont $\\mathbb{P}$-indépendants.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, si $A$ et $B$ sont incompatibles, alors $A$ et $B$ sont $\\mathbb{P}$-indépendants.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, si $A$ et $B$ sont $\\mathbb{P}$-indépendants, alors $A$ et $B$ sont incompatibles.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B)\\in\\mathcal{T}^2$, si $A$ et $B$ sont $\\mathbb{P}$-indépendants, alors $A$ et $B$ sont équiprobables.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, il existe $(A,B)\\in\\mathcal{T}^2$ tels que $A$ et $B$ sont $\\mathbb{P}$-indépendants, équiprobables et incompatibles.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, si $\\mathbb{P}(A)=0$, alors $A$ et $B$ sont $\\mathbb{P}$-indépendants.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, si $\\mathbb{P}(A)=\\mathbb{P}(B))=1$, alors $\\mathbb{P}(A\\cup B) = \\mathbb{P}(A\\cap B)=1$.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout couple $\\left(\\mathbb{P},\\mathbb{Q}\\right)$ de probabilisés sur $\\left(\\Omega,\\mathcal{T}\\right)$, $A$ et $B$ sont $\\mathbb{P}$-indépendants si et seulement si $A$ et $B$ sont $\\mathbb{Q}$-indépendants.", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour toute partie $I$ de $\\mathbb{N}$, pour toute famille $\\left(A_i\\right)_{i\\in I}$ d'éléments de $I$ indexée par $I$, si les événements $A_i$ ($i\\in I$) sont deux à deux $\\mathbb{P}$-indépendants, alors les événements $A_i$ ($i\\in I$) sont mutuellement $\\mathbb{P}$-indépendants.", "a": false}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour toute partie $I$ de $\\mathbb{N}$, pour toute famille $\\left(A_i\\right)_{i\\in I}$ d'éléments de $I$ indexée par $I$, si les événements $A_i$ ($i\\in I$) sont mutuellement $\\mathbb{P}$-indépendants, alors les événements $A_i$ ($i\\in I$) sont deux à deux $\\mathbb{P}$-indépendants.", "a": true}, {"s": "Pour tout espace probabilisable $\\left(\\Omega,\\mathcal{T}\\right)$, pour toute partie $I$ de $\\mathbb{N}$, pour toute famille $\\left(A_i\\right)_{i\\in I}$ d'éléments de $\\mathcal{T}$ indexée par $I$, si les événements $A_i$ ($i\\in I$) sont mutuellement $\\mathbb{P}$-indépendants, alors $\\mathbb{P}\\left(\\displaystyle\\bigcap_{i\\in I}A_i\\right) = \\displaystyle\\prod_{i\\in I}\\mathbb{P}\\left(A_i\\right)$.", "a": false}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $A\\in\\mathcal{T}$, si $\\mathbb{P}(A)\\neq 0$, alors $\\mathbb{P}_A$ est une probabilité sur $\\left(\\Omega,\\mathcal{T}\\right)$.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B,C)\\in\\mathcal{T}^3$, si $\\mathbb{P}(A\\cap B)\\neq 0$, alors $\\mathbb{P}(A\\cap B\\cap C) = \\mathbb{P}(A)\\mathbb{P}_A(B)\\mathbb{P}_{A\\cap B}(C)$.", "a": true}, {"s": "Pour tout espace probabilisé $\\left(\\Omega,\\mathcal{T},\\mathbb{P}\\right)$, pour tout $(A,B,C)\\in\\mathcal{T}^3$, si $A$, $B$ et $C$ sont mutuellement $\\mathbb{P}$-indépendants, alors $A$ et $B\\cup C$ sont $\\mathbb{P}$-indépendants.", "a": true}, {"s": "On considère l'expérience aléatoire consistant à effectuer $5$ tirages successifs sans remise d'une boule dans une urne contenant initialement $4$ boules blanches et $1$ boule noire. La probabilité que le $5$ème tirage amène la boule noire est égale à la probabilité que le $1$er tirage amène la boule noire.", "a": true}, {"s": "On considère l'expérience aléatoire consistant /* ---------- dates ---------- */
function parseFr(d, m, y) { return d === "xx" ? { fuzzy: true, date: new Date(+y, +m - 1, 28) } : { fuzzy: false, date: new Date(+y, +m - 1, +d) } }
function colleDates(c) {
  const m = c.dates.match(/(\d\d)\/(\d\d)\/(\d{4}).*?(\d\d)\/(\d\d)\/(\d{4})/);
  return m ? [new Date(+m[3], +m[2] - 1, +m[1]), new Date(+m[6], +m[5] - 1, +m[4])] : null;
}
function upcoming() {
  const out = [];
  for (const s of SECTIONS) if (s.id === "dm" || s.id === "ds") for (const g of s.groups) for (const it of g.items) {
    const m = it.label.match(/\(?(?:à rendre )?le (\d\d|xx)\/(\d\d)\/(\d{4})\)?/);
    if (!m) continue;
    const d = parseFr(m[1], m[2], m[3]);
    const name = it.label.replace(m[0], "").replace(/\s*:\s*$/, "").replace(/\s+/g, " ").replace(/\s*:\s+/, " · ").trim();
    if (d.date >= TODAY || (d.fuzzy && d.date.getMonth() === TODAY.getMonth() && d.date.getFullYear() === TODAY.getFullYear()))
      out.push({ ...d, what: name, kind: s.id === "dm" ? "À rendre" : "Devoir sur table", route: s.route });
  }
  for (const c of DATA.colles) { const d = colleDates(c); if (d && d[1] >= TODAY) out.push({ date: d[0], fuzzy: false, what: `Colle · semaine ${c.week}`, kind: c.title, route: "colles", week: c.week }); }
  return out.sort((a, b) => a.date - b.date).slice(0, 5);
}

function viewQuizz(s) {

    return `<article class="card quiz-card"><h3>${esc(it.label)}</h3><span class="best">${it.count} questions${best ? ` · meilleur score ${best.s}/${best.t}` : ""}</span>

      <button class="btn" data-quiz="${esc(it.quiz)}" data-shuffle="1">Ordre aléatoire</button>${it.links.map(linkBtn).join("")}</div></article>`; }).join("")}</div>`;
}
function startQuiz(slug, shuffle) {
  const qs = DATA.quizzes[slug], item = byRoute("quizz").groups[0].items.find(i => i.quiz === slug);
  const order = qs.map((_, i) => i);
  if (shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  quiz = { slug, name: item.label, order, i: 0, score: 0, answered: null, wrong: [] };
  render();
}
function playerHTML() {
  const q = quiz, total = q.order.length;
  if (q.i >= total) {
    const best = store.get("best-" + q.slug, null);
    if (!best || q.score > best.s) store.set("best-" + q.slug, { s: q.score, t: total });
    return `<div class="card player"><div class="score">Score final : ${q.score} / ${total}</div>
      <p>${q.wrong.length ? `${q.wrong.length} erreur${q.wrong.length > 1 ? "s" : ""} à revoir.` : "Aucune erreur, bravo."}</p>
      <div class="foot"><span></span><span style="display:flex;gap:8px;flex-wrap:wrap">${q.wrong.length ? `<button class="btn primary" data-act="retry">Revoir mes erreurs</button>` : ""}<button class="btn" data-act="quit">Retour aux quiz</button></span></div></div>`;
  }
  const item = DATA.quizzes[q.slug][q.order[q.i]], a = q.answered;
  const cls = v => a === null ? "" : v === item.a ? "right" : v === a ? "wrong" : "";
  return `<div class="card player">
    <div class="top"><span class="progress">Question ${q.i + 1} / ${total}</span><span class="progress">Score ${q.score}</span></div>
    <div class="bar" style="margin:0"><i style="width:${(100 * q.i / total).toFixed(1)}%;background:var(--pen)"></i></div>
    <div class="q" id="qtext">${esc(item.s)}</div>
    <div class="answers"><button data-ans="1" class="${cls(true)}" ${a !== null ? "disabled" : ""}>Vrai</button><button data-ans="0" class="${cls(false)}" ${a !== null ? "disabled" : ""}>Faux</button></div>
    <div class="feedback ${a === null ? "" : a === item.a ? "ok" : "ko"}">${a === null ? "" : a === item.a ? "Exact." : `Raté : la bonne réponse est « ${item.a ? "Vrai" : "Faux"} ».`}</div>
    <div class="foot"><button class="btn" data-act="quit">Arrêter</button><button class="btn primary" data-act="next" ${a === null ? "disabled" : ""}>Question suivante →</button></div></div>`;
}
function answer(v) {
  if (!quiz || quiz.answered !== null || quiz.i >= quiz.order.length) return;
  const item = DATA.quizzes[quiz.slug][quiz.order[quiz.i]];
  quiz.answered = v;
  if (v === item.a) quiz.score++; else quiz.wrong.push(quiz.order[quiz.i]);
  render();
}
function nextQ() { if (quiz && quiz.answered !== null) { quiz.i++; quiz.answered = null; render(); } }

/* search */
function viewSearch(q) {
  const words = fold(q).split(/\s+/).filter(Boolean);
  const hit = t => words.every(w => fold(t).includes(w));
  const mark = t => { let h = esc(t); for (const w of words) h = h.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>"); return h };
  const docs = [];
  for (const s of SECTIONS) for (const g of s.groups) for (const it of g.items)
    if (hit(`${s.name} ${g.title} ${it.label} ${it.links.map(l => l.label).join(" ")} ${(it.notes || []).join(" ")}`)) docs.push({ s, it });
  const colle = [];
  for (const c of DATA.colles) for (const [kind, list] of [["p", c.proofs], ["e", c.exercises]]) for (const it of list)
    if (hit(`semaine ${c.week} ${it.text} ${(it.parts || []).map(p => p.text).join(" ")} ${(it.links || []).map(l => l.label).join(" ")}`)) colle.push({ c, kind, it });
  if (!docs.length && !colle.length) return `<p class="empty">Aucun résultat pour « ${esc(q)} ».</p>`;
  return `<div class="card results">
    ${docs.length ? `<h2>Documents (${docs.length})</h2><ul class="rows">${docs.slice(0, 40).map(({ s, it }) => `<li><span class="what"><b>${mark(it.label)}</b><span class="sub">${esc(s.name)}</span></span>
      <span class="acts">${it.links.length ? it.links.map(linkBtn).join("") : `<span class="pill soon">à venir</span>`}</span></li>`).join("")}</ul>` : ""}
    ${colle.length ? `<h2>Dans les programmes de colle (${colle.length})</h2><ul class="rows">${colle.slice(0, 30).map(({ c, kind, it }) => `<li><span class="what"><b>${mark(it.text.replace(/\$[^$]*\$/g, "…"))}</b>
      <span class="sub">Semaine ${c.week} · ${kind === "p" ? "preuve" : "exercice"} ${it.n}</span></span><span class="acts"><a class="btn" href="#colles" data-week="${c.week}" data-item="${kind}${it.n}">Voir</a></span></li>`).join("")}</ul>` : ""}</div>`;
}

  if (s.route === "colles" && !q) applyColleFilter();
  typeset(v);
  if (pendingItem) { const el = document.getElementById(pendingItem); pendingItem = null; if (el) el.scrollIntoView({ block: "center" }); }
}
document.addEventListener("click", e => {
  const wk = e.target.closest("[data-week]");
  if (wk) {
    colleWeek = +wk.dataset.week; store.set("week", colleWeek);
    if (wk.dataset.item) pendingItem = wk.dataset.item;
    if (wk.tagName === "BUTTON") { e.preventDefault(); render(); return; }
    $("#q").value = "";
    if (location.hash === "#colles") { e.preventDefault(); render(); }
    return;
  }
  const f = e.target.closest(".filters button");
  if (f) { colleFilter = f.dataset.f; store.set("filter", colleFilter); applyColleFilter(); return; }
  const qz = e.target.closest("[data-quiz]");
  if (qz) { startQuiz(qz.dataset.quiz, !!qz.dataset.shuffle); return; }
  const ans = e.target.closest("[data-ans]");
  if (ans) { answer(ans.dataset.ans === "1"); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    if (act.dataset.act === "next") nextQ();
    if (act.dataset.act === "quit") { quiz = null; render(); }
    if (act.dataset.act === "retry") { quiz = { ...quiz, order: quiz.wrong, i: 0, score: 0, answered: null, wrong: [] }; render(); }
  }
  if (e.target.closest("#menu a, .tile, .brand") && $("#q").value) { $("#q").value = ""; setTimeout(render); }
});
document.addEventListener("change", e => {
  const c = e.target.closest("input[data-key]");
  if (!c) return;
  store.set(c.dataset.key, c.checked);
  c.closest("li").classList.toggle("is-done", c.checked);
  const ann = DATA.colles.find(x => x.week === colleWeek);
  if (ann) { const [d, t] = doneCount(ann); const k = $("#kpi-done"); if (k) k.textContent = `${d}/${t}`; }
  if (colleFilter === "todo") applyColleFilter();
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape" && document.activeElement === $("#q")) { $("#q").value = ""; render(); return; }
  if (quiz && !typing) {
    if (e.key === "v" || e.key === "V") answer(true);
    else if (e.key === "f" || e.key === "F") answer(false);
    else if (e.key === "Enter") nextQ();
  }
});
$("#q").addEventListener("input", render);
window.addEventListener("hashchange", () => { if (location.hash !== "#quizz") quiz = null; render(); scrollTo(0, 0); });
$("#stamp").textContent = "Mis à jour le " + DATA.updated;
render();
</script>
